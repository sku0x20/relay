name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # toolchain version comes from mise.toml
      - uses: jdx/mise-action@v3
        with:
          install_args: zig

      - name: Check formatting
        run: zig fmt --check build.zig src

      - name: Build
        run: zig build

      - name: e2e tests
        run: zig build e2e --summary all
